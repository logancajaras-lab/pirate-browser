<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pirate Test Runner</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f1f5f9;
      color: #0f172a;
    }
    .container {
      max-width: 90%;
      margin: 40px auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      padding: 32px;
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .spinner {
      border: 3px solid #e2e8f0;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .progress-text {
      font-size: 16px;
      color: #475569;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .progress-bar-bg {
      background: #e2e8f0;
      border-radius: 999px;
      height: 12px;
      width: 100%;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .progress-bar-fill {
      background: #3b82f6;
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .log-container {
      background: #0f172a;
      color: #f8fafc;
      border-radius: 8px;
      padding: 16px;
      font-family: monospace;
      font-size: 13px;
      height: 65vh;
      overflow-y: auto;
    }
    .log-item {
      margin-bottom: 8px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      word-break: break-all;
    }
    .log-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .log-success { color: #10b981; }
    .log-error { color: #ef4444; }
    .log-info { color: #3b82f6; }
    
    .done-container {
      display: none;
      text-align: center;
      padding: 32px 0;
    }
    .done-icon {
      width: 64px;
      height: 64px;
      color: #10b981;
      margin: 0 auto 16px auto;
    }
    .btn-close {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="running-view">
      <h1><div class="spinner"></div> Running Test Profile...</h1>
      <div class="progress-text" id="progress-text">Initializing...</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      
      <div class="log-container" id="log-box"></div>
    </div>
    
    <div id="done-view" class="done-container">
      <svg class="done-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <h1 style="justify-content: center; margin-bottom: 8px;">Testing Complete!</h1>
      <p style="color: #64748b; font-size: 16px;">The profile has been successfully tested. You can close this tab.</p>
    </div>
  </div>

  <script src="testrunner.js"></script>
</body>
</html>
